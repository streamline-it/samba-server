---
- name: make sure needed packages are installed for Samba (via DNF)
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  loop:
    - samba
    - samba-client
  when: (ansible_distribution_major_version == "7" or
        ansible_distribution_major_version == "8" or
        ansible_distribution_major_version == "9")

- name: make sure needed packages are installed for Samba (via yum)
  ansible.builtin.yum:
    name: "{{ item }}"
    state: present
  loop:
    - samba
    - samba-client
  when: 
    - ansible_distribution_major_version == "6"
