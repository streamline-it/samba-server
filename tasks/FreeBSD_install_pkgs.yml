---
- name: ensure needed packages are installed on the host (pkgng)
  when: samba_jail_it == false
  loop:
    "{{ samba_pkgs }}"
  ansible.builtin.pkgng:
    name: "{{ item['name'] }}"
    state: present

- name: ensure needed packages are installed in the specified jail (pkgng)
  when: samba_jail_it == true
  loop:
    "{{ samba_pkgs }}"
  ansible.builtin.pkgng:
    name: "{{ item['name'] }}"
    jail: "{{ samba_jailname }}"
    state: present
