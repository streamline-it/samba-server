---
- name: ensure needed packages are installed on the host
  when: samba_jail_it == false
  loop:
    - apache24
  ansible.builtin.pkgng:
    name: "{{ item }}"
    state: present

- name: ensure needed packages are installed in the specified jail
  when: samba_jail_it == true
  loop:
    - apache24
  ansible.builtin.pkgng:
    name: "{{ item }}"
    jail: "{{ samba_jailname }}"
    state: present
