- name: make sure to add the users to the host
  when: samba_jail_it == false
  no_log: true
  loop:
    "{{ samba_userlist }}"
  ansible.builtin.user:
    name: "{{ item['username'] }}"
    groups: "{{ samba_smb_group }}"
    password: "{{ item['password'] | password_hash('sha512', 'mysecretsalt') }}"

- name: check the jail to see if the user(s) exists
  register: samba_user_check
  no_log: false 
  when: samba_jail_it == true
  failed_when: samba_user_check['rc'] > 2
  loop:
    "{{ samba_userlist }}"
  ansible.builtin.shell: >
    /usr/sbin/jexec -lU root {{ samba_jailname }} /usr/bin/getent passwd {{ item['username']}}

- name: make sure to add the users to the jail 
  no_log: true
  loop:
    "{{ samba_userlist | zip(samba_user_check['results']) | list}}"
  when: 
    - samba_jail_it == true
    - item[1]['rc'] == 2
  ansible.builtin.shell: >
    jexec -lu root {{ samba_jailname }} pw useradd -n {{ item[0]['username'] }} -G {{ samba_smb_group }}
  
- name: make sure to add the samba users on the host
  when: samba_jail_it == false
  no_log: true
  register: smbpasswd
  changed_when: "'Added user' in smbpasswd.stdout"
  loop: 
    "{{ samba_userlist }}"
  args: 
    executable: /bin/sh
  ansible.builtin.shell: >
    set -e -o pipefail
    && (pdbedit --user={{ item.username }} 2>&1 > /dev/null)
    || (echo '{{ item.password }}'; echo '{{ item.password }}')
    | smbpasswd -s -a {{ item.username }}

- name: make sure to add the samba users in the jail
  when: samba_jail_it == true
  no_log: true
  register: smbpasswd
  changed_when: "'Added user' in smbpasswd.stdout"
  loop: 
    "{{ samba_userlist }}"
  args: 
    executable: /bin/sh
  ansible.builtin.shell: >
    /usr/sbin/jexec -lU root "{{ samba_jailname }}" sh -c 'set -e -o pipefail
    && (/usr/local/bin/pdbedit --user={{ item.username }} 2>&1 > /dev/null)
    || (echo {{ item.password }}; echo {{ item.password }})
    | /usr/local/bin/smbpasswd -s -a {{ item.username }}'
