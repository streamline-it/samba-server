---
# tasks file for samba
- name: make sure OS dependent variables are included
  ansible.builtin.include_vars:
    "./vars/{{ ansible_os_family }}.yml"

- name: call tasks to check asserts
  ansible.builtin.include_tasks: asserts.yml

- name: call tasks to add groups
  ansible.builtin.include_tasks: configure_groups.yml

- name: call tasks to make sure Samba packages are installed
  ansible.builtin.include_tasks: "tasks/{{ ansible_os_family }}_install_pkgs.yml"

- name: make sure Samba's data directories are created
  loop:
    "{{ samba_service_shares }}"
  ansible.builtin.file:
    path: "{{ item['outside_path'] }}"
    mode: "{{ item['mode'] }}"
    group: "{{ item['force_group'] }}"
    owner: root
    setype: samba_share_t
    state: directory
 
- name: make sure Samba's configuration is setup
  notify: restart samba services
  ansible.builtin.template:
    src: smb.conf.j2
    dest: "{{ samba_config_filepath }}"
    mode: '0600'

- name: call tasks to make sure necessary services are enabled/started
  ansible.builtin.include_tasks: "tasks/{{ ansible_os_family }}_start_svc.yml"

- name: call tasks to add users
  ansible.builtin.include_tasks: "tasks/{{ ansible_os_family }}_configure_users.yml"
