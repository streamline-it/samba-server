---
# tasks file for samba
- name: make sure OS dependent variables are included
  ansible.builtin.include_vars:
    "./vars/{{ ansible_os_family }}.yml"

- name: make sure samba group exists on the host not specifying group's gid
  when: samba_jail_it == false and samba_smb_group_gid == ""
  ansible.builtin.group:
    name: "{{ samba_smb_group }}"
    state: present

- name: make sure samba group exists on the host specifying group's gid
  when: samba_jail_it == false and samba_smb_group_gid != ""
  ansible.builtin.group:
    name: "{{ samba_smb_group }}"
    gid: "{{ samba_smb_group_gid }}"
    state: present

- name: make sure samba group exists in the jail not specifying GID
  register: group_add_result
  when: samba_jail_it == true and samba_smb_group_gid == ""
  failed_when: group_add_result['rc'] > 0 and group_add_result['rc'] != 65
  ansible.builtin.command:
    cmd: jexec -lU root {{ samba_jailname }} sh -c 'pw groupadd -n "{{ samba_smb_group }}"'

- name: make sure samba group exists in the jail specifying GID
  register: group_add_result
  when: samba_jail_it == true and samba_smb_group_gid != ""
  failed_when: group_add_result['rc'] > 0 and group_add_result['rc'] != 65
  ansible.builtin.command:
    cmd: jexec -lU root {{ samba_jailname }} sh -c 'pw groupadd -n "{{ samba_smb_group }}" -g {{ samba_smb_group_gid }}'

- name: call tasks to make sure Samba packages are installed
  ansible.builtin.include_tasks: "tasks/{{ ansible_os_family }}_install_pkgs.yml"

- name: make sure Samba's data directories are created
  loop:
    "{{ samba_service_shares }}"
  ansible.builtin.file:
    path: "{{ item['outside_path'] }}"
    mode: "{{ item['mode'] }}"
    group: "{{ samba_smb_group }}"
    owner: root
    setype: samba_share_t
    state: directory
 
- name: make sure Samba's configuration is setup
  notify: restart samba services
  ansible.builtin.template:
    src: smb.conf.j2
    dest: "{{ samba_config_filepath }}"
    mode: '0600'

- name: call tasks to make sure necessary services are enabled/started
  ansible.builtin.include_tasks: "tasks/{{ ansible_os_family }}_start_svc.yml"

- name: call tasks to add users
  ansible.builtin.include_tasks: "tasks/{{ ansible_os_family }}_configure_users.yml"
