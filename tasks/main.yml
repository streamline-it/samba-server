---
# tasks file for samba
- name: make sure samba group exists
  ansible.builtin.group:
    name: "{{ samba_smb_group }}"
    state: present

- name: call tasks to make sure Samba packages are installed
  ansible.builtin.include_tasks: "tasks/{{ ansible_os_family }}_install_pkgs.yml"

- name: make sure Samba's data directories are created
  loop:
    "{{ samba_service_shares }}"
  ansible.builtin.file:
    path: "{{ item['share_path'] }}"
    mode: "{{ item['mode'] }}"
    group: "{{ samba_smb_group }}"
    owner: root
    setype: samba_share_t
    state: directory
    
- name: make sure Samba's configuration is setup
  notify: restart samba services
  ansible.builtin.template:
    src: templates/smb.conf.j2
    dest: /etc/samba/smb.conf
    mode: 0600

- name: call tasks to make sure necessary services are enabled/started
  ansible.builtin.include_tasks: "tasks/{{ ansible_os_family }}_start_svc.yml"

- name: make sure to add the samba users
  no_log: true
  register: smbpasswd
  changed_when: "'Added user' in smbpasswd.stdout"
  loop: 
    "{{ samba_userlist }}"
  args: 
    executable: /bin/bash
  ansible.builtin.shell: >
    set -e -o pipefail
    && (pdbedit --user={{ item.username }} 2>&1 > /dev/null)
    || (echo '{{ item.password }}'; echo '{{ item.password }}')
    | smbpasswd -s -a {{ item.username }}
