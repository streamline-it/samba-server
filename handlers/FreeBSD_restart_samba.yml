---
- name: restart samba services on host FreeBSD
  loop: 
    "{{ samba_svcs }}"
  when: samba_jail_it == false
  ansible.builtin.service:
    name: "{{ item['name'] }}"
    state: restarted

- name: restart samba services on host FreeBSD
  loop: 
    "{{ samba_svcs }}"
  when: samba_jail_it == true
  ansible.builtin.command:
    cmd: service -j "{{ samba_jailname }}" "{{ item['name'] }}" restart
