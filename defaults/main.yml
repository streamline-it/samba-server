# defaults file for samba

# If true install into a FreeBSD jail
samba_jail_it: false

# name of the jail include the tailing slash
samba_jailname: 

# path to the jail
samba_jail_path: 

samba_base_share_path: "{{ samba_jail_path }}"
# the following variable should be secured in a encrypted vault
samba_userlist: 
  username: ''
  password: ''

samba_smb_group: smbusers
samba_smb_group_gid: 
samba_smb_smbuser: smbuser
samba_netbios_name: server
samba_maptoguest: "map to guest = bad user"
samba_interfaces: 127.0.0.1
samba_ipv4_address: 

samba_client_list: ""
samba_hosts_allow: "127.0.0.1 {{ samba_client_list }}"
samba_workgroup: workgroup
samba_log_directory: samba
samba_log_file_path: "/var/log/{{ samba_log_directory }}/log.smbd"
samba_log_level: 2
samba_log_max_size: 500

samba_service_shares:
  - name: docs
    comment: Documents
    share_path: "{{ samba_base_share_path }}/exp/cifs/data/docs"
    mode: 2770
    conf_access_rights: "write list = {{ samba_smb_group }}"
    conf_valid_users: "valid users = {{ samba_smb_group }}"
    create_mask: "create mask = 0660"
    directory_mask: "directory mask = 0770"
    read_only: "read only = no"
    force_group: "{{ samba_smb_group }}"
    force_create_mode: "force create mode = 0660"
  - name: backups
    comment: Backups
    share_path: /exp/cifs/backups
    mode: 2550
    conf_access_rights: "public = yes"
    conf_valid_users: "valid users = {{ samba_smb_group }}"
    create_mask: ""
    directory_mask: ""
    read_only: "read only = yes"
    force_group: "{{ samba_smb_group }}"
    force_create_mode: "force create mode = 0660"
  - name: public
    comment: Public
    share_path: "{{ samba_base_share_path }}/exp/cifs/data/public"
    mode: 2550
    conf_access_rights: "public = yes"
    conf_valid_users: ""
    create_mask: ""
    directory_mask: ""
    read_only: "read only = yes"
    force_group: "{{ samba_smb_group }}"
    force_create_mode: "force create mode = 0660"
